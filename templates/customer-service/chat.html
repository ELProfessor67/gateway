        .chat-online {

        .chat-messages {
            display: flex;
            flex-direction: column;
            max-height: 83vh;
            min-height: 83vh;
            overflow-y: scroll
        }

        .chat-message-left,
        .chat-message-right {
            display: flex;
            flex-shrink: 0
        }

        .chat-message-left {
            margin-right: auto
        }

        .chat-message-right {
            flex-direction: row-reverse;
            margin-left: auto
        }

        .py-3 {
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
        }

        .px-4 {
            padding-right: 1.5rem !important;
            padding-left: 1.5rem !important;
        }

        .flex-grow-0 {
            flex-grow: 0 !important;
        }

        .border-top {
            border-top: 1px solid #dee2e6 !important;
        }

        .typing {
            width: 5em;
            height: 2em;
            position: relative;
            padding: 10px;
            margin-left: 5px;
            border-radius: 20px;
        }



        .typing__dot {
            float: left;
            width: 8px;
            height: 8px;
            margin: 0 4px;
            background: #8d8c91;
            border-radius: 50%;
            opacity: 0;
            animation: loadingFade 1s infinite;
        }

        .typing__dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing__dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing__dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loadingFade {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

    <script>

        const messageContainerRef = document.getElementById("message-container");
        const typingRef = document.getElementById("typing");

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
        }

        function addMessage(message, side, person,avatar) {

           

            const time = new Date().toLocaleString().split(",")[1];

            const div = document.createElement("div");
            div.classList.add(`chat-message-${side}`);
            div.classList.add(`mb-4`);


            const element = `
                                    <div>
                                        <img src="${avatar}"
                                            class="rounded-circle mr-1" alt="Chris Wood" width="40" height="40">
                                        <div class="text-muted small text-nowrap mt-2">${time}</div>
                                    </div>
                                    <div class="flex-shrink-1 bg-light rounded py-2 px-3 mr-3" style="margin: 0 .5rem">
                                        <div class="font-weight-bold mb-1">${person}</div>
                                        ${message}
                                    </div>`;

            div.innerHTML = element;
            messageContainerRef.appendChild(div);
        }

        async function sendQuestion(question) {
            addMessage(question, "right", "You","{%static '/images/user.jpg'%}");
            typingRef.style.display = "block";
            const url = location.origin + `/answer?question=${question}`
            const res = await fetch(url);
            const answer = await res.text();
            await sleep(2000) 
            
            typingRef.style.display = "none";
            addMessage(answer, "left", "Customer Support","{%static '/images/bot.jpeg'%}");

        }
    </script>
